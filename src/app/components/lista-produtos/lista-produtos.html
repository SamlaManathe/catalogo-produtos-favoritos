<div class="lista-produtos">
  <h2 class="titulo">Catálogo de Produtos</h2>

  <p *ngIf="carregando">Carregando produtos...</p>
  <p *ngIf="erro">Não foi possível carregar os produtos. Tente novamente mais tarde.</p>

  <div *ngIf="!carregando && !erro">
    <section class="categoria" *ngFor="let categoria of categorias">
      <h3 class="nome-categoria">{{ categoria.nome }}</h3>

      <div class="grid">
        <div class="card" *ngFor="let produto of categoria.produtos">
          <a [routerLink]="['/produtos', produto.id]">
            <img [src]="produto.image" [alt]="produto.title" />
          </a>

          <h3>{{ produto.title }}</h3>
          <p class="preco">R$ {{ produto.price | number:'1.2-2' }}</p>

          <button
            class="btn-favoritar"
            [class.favoritado]="isFavorito(produto)"
            (click)="toggleFavorito(produto)">
            Favoritar
          </button>
        </div>
      </div>
    </section>
  </div>
</div>
